name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile native and managed code
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Check native DSP and localization
        shell: pwsh
        run: |
          $process = Start-Process ./src/CSMic/bin/Release/net10.0-windows/CSMic.exe -ArgumentList '--diagnostics',"$PWD/diagnostics.json" -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content diagnostics.json; throw 'Diagnostics failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: src/CSMic/bin/Release/net10.0-windows/
